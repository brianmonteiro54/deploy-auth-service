apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-rds
  namespace: togglemaster-auth-brian
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-us-east-1
    kind: SecretStore
  target:
    name: auth-service-rds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: rds!db-60db3cc5-b614-471b-a41a-1bfa557a8dd9
        property: username
    - secretKey: password
      remoteRef:
        key: rds!db-60db3cc5-b614-471b-a41a-1bfa557a8dd9
        property: password