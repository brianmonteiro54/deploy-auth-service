## ──────────────────────────────────────────────
## ExternalSecret: RDS credentials (managed by AWS RDS)
## ──────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-rds
  namespace: togglemaster-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-us-east-1
    kind: SecretStore
  target:
    name: auth-service-rds
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: rds!db-2c52e4c7-bcd4-4a95-b14e-83be5ff6a6b0
        property: username
    - secretKey: password
      remoteRef:
        key: rds!db-2c52e4c7-bcd4-4a95-b14e-83be5ff6a6b0
        property: password
---
## ──────────────────────────────────────────────
## ExternalSecret: Auth service config
## Source: togglemaster/auth-service (AWS Secrets Manager)
## Creates K8s Secret: auth-service-config
## ──────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-service-config
  namespace: togglemaster-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-us-east-1
    kind: SecretStore
  target:
    name: auth-service-config
    creationPolicy: Owner
  data:
    - secretKey: AUTH_DB_HOST
      remoteRef:
        key: togglemaster/auth-service
        property: AUTH_DB_HOST
    - secretKey: AUTH_DB_PORT
      remoteRef:
        key: togglemaster/auth-service
        property: AUTH_DB_PORT
    - secretKey: AUTH_DB_NAME
      remoteRef:
        key: togglemaster/auth-service
        property: AUTH_DB_NAME
---
## ──────────────────────────────────────────────
## ExternalSecret: Master key
## Source: togglemaster/auth-service (AWS Secrets Manager)
## Creates K8s Secret: togglemaster-secrets
## ──────────────────────────────────────────────
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: togglemaster-secrets
  namespace: togglemaster-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: togglemaster
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager-us-east-1
    kind: SecretStore
  target:
    name: togglemaster-secrets
    creationPolicy: Owner
  data:
    - secretKey: MASTER_KEY
      remoteRef:
        key: togglemaster/auth-service
        property: MASTER_KEY