## ──────────────────────────────────────────────
## Job: Database initialization for auth-service
## Runs as ArgoCD Sync Hook (wave 1) after ExternalSecrets
## are synced (wave 0) and before Deployment starts (wave 2).
## SQL is idempotent (IF NOT EXISTS) — safe to re-run.
## ──────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-init-sql
  namespace: togglemaster-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: togglemaster
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
data:
  init.sql: |
    CREATE TABLE IF NOT EXISTS api_keys (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100) NOT NULL,
        key_hash VARCHAR(64) NOT NULL UNIQUE,
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP
    );
---
apiVersion: batch/v1
kind: Job
metadata:
  name: auth-db-init
  namespace: togglemaster-auth
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/component: auth
    app.kubernetes.io/part-of: togglemaster
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/component: db-init
    spec:
      restartPolicy: Never
      containers:
        - name: psql-init
          image: postgres:16-alpine
          command:
            - /bin/sh
            - -c
            - |
              echo "Executando init.sql em ${PGHOST}:${PGPORT}/${PGDATABASE}..."
              psql -f /mnt/init.sql
              RESULT=$?
              if [ $RESULT -eq 0 ]; then
                echo "Init do banco auth concluído com sucesso!"
              else
                echo "Erro ao executar init.sql (exit code: $RESULT)"
                exit $RESULT
              fi
          env:
            - name: PGHOST
              valueFrom:
                secretKeyRef:
                  name: auth-service-config
                  key: AUTH_DB_HOST
            - name: PGPORT
              valueFrom:
                secretKeyRef:
                  name: auth-service-config
                  key: AUTH_DB_PORT
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: auth-service-config
                  key: AUTH_DB_NAME
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: auth-service-rds
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: auth-service-rds
                  key: password
            - name: PGSSLMODE
              value: "require"
          volumeMounts:
            - name: init-sql
              mountPath: /mnt
      volumes:
        - name: init-sql
          configMap:
            name: auth-db-init-sql
